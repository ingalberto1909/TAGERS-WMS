<!DOCTYPE html>
<html>
<head>
<base target="_top">

<meta name="viewport" id="viewportMeta" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script>
(function(){
  function ajustarViewport(){
    var vp = document.getElementById('viewportMeta');
    if(!vp) return;
    var anchoPantalla = (window.screen && window.screen.width) || 0;
    var ancho = anchoPantalla > 0 ? anchoPantalla : (document.documentElement.clientWidth || window.innerWidth);
    vp.setAttribute('content','width=' + ancho + ', initial-scale=1, maximum-scale=1, user-scalable=no');
  }
  // Cuando la app corre dentro del iframe que arma script.google.com, el
  // <meta viewport> de ESTA página no tiene ningún efecto sobre los
  // @media (max-width:...) del CSS: evalúan el ancho real del iframe que
  // Google decide, no el de la pantalla del celular. Aquí se usa
  // screen.width (ancho físico real del dispositivo) para forzar a
  // "siempre aplican" las reglas @media que deberían estar activas según
  // el tamaño real de pantalla, aunque el iframe reporte un ancho de escritorio.
  function forzarResponsiveSiHaceFalta(){
    if(!window.screen || !window.screen.width) return;
    var anchoReal = window.screen.width;
    try{
      for (var s = 0; s < document.styleSheets.length; s++){
        var reglas;
        try{ reglas = document.styleSheets[s].cssRules; } catch(e){ continue; }
        if(!reglas) continue;
        for (var r = 0; r < reglas.length; r++){
          var regla = reglas[r];
          if(regla.type !== CSSRule.MEDIA_RULE) continue;
          var texto = regla.media.mediaText;
          var coincide = texto.match(/max-width:\s*(\d+)px/);
          if(coincide && anchoReal <= parseInt(coincide[1], 10)){
            regla.media.mediaText = 'all';
          }
        }
      }
    }catch(e){ /* si el navegador no deja tocar cssRules, se queda como estaba */ }
  }
  ajustarViewport();
  window.addEventListener('load', function(){ ajustarViewport(); forzarResponsiveSiHaceFalta(); });
  window.addEventListener('resize', ajustarViewport);
  window.addEventListener('orientationchange', ajustarViewport);
  setTimeout(function(){ ajustarViewport(); forzarResponsiveSiHaceFalta(); }, 150);
  setTimeout(function(){ ajustarViewport(); forzarResponsiveSiHaceFalta(); }, 600);
  setTimeout(function(){ ajustarViewport(); forzarResponsiveSiHaceFalta(); }, 1500);
  setTimeout(function(){ ajustarViewport(); forzarResponsiveSiHaceFalta(); }, 3000);
})();
</script>

/* ============ VIDEO DE FONDO ============ */

.videoFondo{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
}

.overlayFondo{
  position:fixed;
  inset:0;
  z-index:1;
  background:
    linear-gradient(135deg, rgba(61,20,28,.88) 0%, rgba(107,39,55,.72) 45%, rgba(107,39,55,.35) 100%);
}

.overlayFondo::after{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 15% 85%, rgba(196,82,42,.35), transparent 45%);
}

/* ============ MARCA ARRIBA A LA IZQUIERDA ============ */

.brandTop{
  position:fixed;
  top:28px;
  left:32px;
  z-index:5;
  color:#fff;
  display:flex;
  align-items:center;
  gap:10px;
  text-shadow:0 2px 10px rgba(0,0,0,.35);
}

.brandTop .icono{
  width:38px;
  height:38px;
  border-radius:10px;
  background:rgba(255,255,255,.14);
  backdrop-filter:blur(6px);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  border:1px solid rgba(255,255,255,.25);
}

.brandTop .texto b{
  display:block;
  font-size:16px;
  letter-spacing:.3px;
}

.brandTop .texto span{
  display:block;
  font-size:10px;
  opacity:.75;
  letter-spacing:2px;
}

/* ============ CHIPS FLOTANTES (abajo izquierda, desktop) ============ */

.chipsFlotantes{
  position:fixed;
  bottom:32px;
  left:32px;
  z-index:5;
  display:none;
  flex-direction:column;
  gap:10px;
}

.chip{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 16px;
  border-radius:30px;
  background:rgba(255,255,255,.1);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.18);
  color:#fff;
  font-size:12.5px;
  text-shadow:0 1px 6px rgba(0,0,0,.3);
  animation:aparecerChip .6s ease both;
}

.chip:nth-child(2){ animation-delay:.15s; }
.chip:nth-child(3){ animation-delay:.3s; }

@keyframes aparecerChip{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:translateY(0); }
}

@media (min-width:860px){
  .chipsFlotantes{ display:flex; }
}

/* ============ TARJETA LOGIN ============ */

.wrapCentrado{
  position:relative;
  z-index:5;
  min-height:100%;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.tarjetaLogin{
  width:100%;
  max-width:380px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border:1px solid rgba(255,255,255,.18);
  border-radius:22px;
  padding:38px 32px;
  box-shadow:0 25px 70px rgba(0,0,0,.45);
  animation:apareceTarjeta .7s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes apareceTarjeta{
  from{ opacity:0; transform:translateY(24px) scale(.98); }
  to{ opacity:1; transform:translateY(0) scale(1); }
}

.tarjetaLogin h1{
  margin:0 0 6px;
  font-size:24px;
  color:#fff;
  font-weight:700;
}

.tarjetaLogin p.sub{
  margin:0 0 28px;
  font-size:13px;
  color:rgba(255,255,255,.7);
}

.campo{
  margin-top:16px;
  position:relative;
}

.campo label{
  font-size:11.5px;
  color:rgba(255,255,255,.65);
  margin-bottom:6px;
  display:block;
  letter-spacing:.3px;
  text-transform:uppercase;
}

input{
  width:100%;
  padding:13px 14px;
  border-radius:12px;
  border:1.5px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:14.5px;
  outline:none;
  transition:border .15s ease, background .15s ease;
}

input::placeholder{ color:rgba(255,255,255,.4); }

input:focus{
  border-color:var(--terracota);
  background:rgba(255,255,255,.13);
}

.togglePass{
  position:absolute;
  right:14px;
  top:39px;
  cursor:pointer;
  font-size:16px;
  opacity:.7;
  user-select:none;
}

button{
  width:100%;
  margin-top:26px;
  padding:14px;
  border-radius:12px;
  border:0;
  background:linear-gradient(135deg, var(--terracota), #a8431f);
  color:white;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:filter .15s ease, transform .1s ease;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  box-shadow:0 10px 25px rgba(196,82,42,.35);
}

button:hover{ filter:brightness(1.08); }
button:active{ transform:scale(.98); }
button:disabled{ opacity:.6; cursor:default; }

.spinner{
  width:16px;
  height:16px;
  border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;
  border-radius:50%;
  animation:girar .7s linear infinite;
  display:none;
}

@keyframes girar{ to{ transform:rotate(360deg); } }

#mensaje{
  min-height:18px;
  font-size:13px;
  color:#ffb4a3;
  margin-top:14px;
  text-align:center;
}

.notaFooter{
  margin-top:22px;
  font-size:11.5px;
  color:rgba(255,255,255,.55);
  text-align:center;
  line-height:1.5;
  border-top:1px solid rgba(255,255,255,.12);
  padding-top:16px;
}

@media (max-height:680px){
  .tarjetaLogin{ padding:26px 26px; }
  .campo{ margin-top:12px; }
}

</style>
</head>

      <span class="togglePass" id="togglePass" onclick="mostrarPassword()">👁️</span>
    </div>

    <button id="btnEntrar" onclick="entrar()">
      <span id="txtBtn">Iniciar sesión</span>
      <span class="spinner" id="spinnerBtn"></span>
    </button>

    <p id="mensaje"></p>

    <p class="notaFooter">Acceso exclusivo para personal autorizado de TAGERS.<br>¿Problemas para entrar? Contacta a tu supervisor.</p>

  </div>
</div>

<script>

// Si el video no carga (sin internet, red lenta, bloqueado), lo ocultamos
// y se queda visible el fondo de imagen + degradado ya definido en el body.
document.getElementById('videoFondo').addEventListener('error', function(){
  this.style.display = 'none';
});

document.getElementById("password").addEventListener("keydown", function(e){
  if(e.key === "Enter") entrar();
});

function mostrarPassword(){
  const input = document.getElementById("password");
  const icono = document.getElementById("togglePass");
  if(input.type === "password"){
    input.type = "text";
    icono.innerText = "🙈";
  } else {
    input.type = "password";
    icono.innerText = "👁️";
  }
}

function entrar(){

  const correo = document.getElementById("correo").value.trim();
  const password = document.getElementById("password").value;
  const mensaje = document.getElementById("mensaje");

  if(!correo || !password){
    mensaje.innerText = "Ingresa correo y contraseña";
    return;
  }

  mensaje.innerText = "";
  document.getElementById("btnEntrar").disabled = true;
  document.getElementById("txtBtn").style.display = "none";
  document.getElementById("spinnerBtn").style.display = "inline-block";

  google.script.run
    .withSuccessHandler(function(res){

      if(res.ok){

        localStorage.setItem("tagers_token", res.token);
        localStorage.setItem("tagers_usuario", JSON.stringify({
          nombre: res.nombre,
          rol: res.rol
        }));

        window.top.location.href = "<?= urlApp ?>?page=index";

      } else {
        restaurarBoton();
        mensaje.innerText = "Correo o contraseña incorrectos";
      }

    })
    .withFailureHandler(function(error){
      restaurarBoton();
      mensaje.innerText = "Error: " + error.message;
    })
    .validarUsuario(correo, password);

}

function restaurarBoton(){
  document.getElementById("btnEntrar").disabled = false;
  document.getElementById("txtBtn").style.display = "inline";
  document.getElementById("spinnerBtn").style.display = "none";
}

</script>

</body>
</html>
