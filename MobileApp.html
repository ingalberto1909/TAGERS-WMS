function tgmAlternarTema_(){
  const actual = document.documentElement.getAttribute("data-theme");
  const nuevo = actual === "dark" ? "light" : "dark";
  if(nuevo === "dark"){
    document.documentElement.setAttribute("data-theme", "dark");
  } else {
    document.documentElement.removeAttribute("data-theme");
  }
  localStorage.setItem("tagers-tema", nuevo);
  const el = document.getElementById("tgmEstadoTema");
  if(el) el.textContent = nuevo === "dark" ? "Activado" : "Desactivado";
}

function tgmCerrarSesion_(){
  if(!confirm("¿Cerrar sesión?")) return;
  google.script.run
    .withSuccessHandler(tgmIrALogin)
    .withFailureHandler(tgmIrALogin)
    .cerrarSesionApp(tgmObtenerToken());
}

// ============================================
// REQUISICIONES — lista (Pendientes/Entregadas/Todas) + detalle + Surtido.
// Alcance de esta fase: solo Requisiciones de Área (crearRequisicionApp /
// obtenerRequisicionesApp / confirmarEntregaRequisicionApp), el mismo
// sistema simple que ya prueban RIM-002/003. Las Requisiciones de
// Sucursal y de Receta (RequisicionesSucursal.gs / RequisicionesRecetas.gs)
// tienen flujos de aprobación/despacho propios más complejos y quedan
// fuera de esta pasada — no se inventa soporte a medias para ellas.
//
// IMPORTANTE sobre Surtido: confirmarEntregaRequisicionApp es una
// operación de UN SOLO DISPARO — la primera llamada ya marca TODA la
// requisición como ENTREGADA y libera la reserva completa (ver el
// backend). Por eso el flujo "producto por producto" del mockup NO
// dispara una llamada al servidor por cada producto: acumula las
// cantidades en el cliente mientras se avanza, y solo hace la llamada
// real (una sola vez, con todo el arreglo) al terminar el último
// producto. Llamar la función una vez por producto habría cerrado la
// requisición y liberado la reserva desde el primer producto, rompiendo
// el resto de la captura.
// ============================================
let TGM_REQ_TAB = "pendientes";
let TGM_REQ_ACCESO = null;
let TGM_REQ_DETALLE = null;
let TGM_SURTIDO_FOLIO = null;
let TGM_SURTIDO_ITEMS = [];
let TGM_SURTIDO_INDICE = 0;
let TGM_SURTIDO_ENTREGAS = [];

function tgmAbrirRequisiciones(){

  TGM_TAB_ACTIVA = "requisiciones";
  tgmRenderNavInferior();
  tgmRenderHeaderRaiz("Requisiciones");
  TGM_REQ_TAB = "pendientes";

  document.getElementById("tgmContenido").innerHTML =
    '<div class="tgmTabs">' +
      '<button class="tgmTab activa" onclick="tgmReqCambiarTab_(\'pendientes\')">Pendientes</button>' +
      '<button class="tgmTab" onclick="tgmReqCambiarTab_(\'entregadas\')">Entregadas</button>' +
      '<button class="tgmTab" onclick="tgmReqCambiarTab_(\'todas\')">Todas</button>' +
    '</div>' +
    '<div id="tgmReqLista"><div class="tgmVacio">Cargando…</div></div>';

  google.script.run
    .withSuccessHandler(function(acceso){ TGM_REQ_ACCESO = acceso; })
    .withFailureHandler(function(){ TGM_REQ_ACCESO = null; })
    .obtenerAccesoRequisicionesApp(tgmObtenerToken());

  tgmReqCargarLista_();

}

function tgmReqCambiarTab_(tab){
  TGM_REQ_TAB = tab;
  const orden = ["pendientes", "entregadas", "todas"];
  document.querySelectorAll("#tgmContenido .tgmTabs .tgmTab").forEach(function(btn, idx){
    btn.classList.toggle("activa", orden[idx] === tab);
  });
  tgmReqCargarLista_();
}

function tgmReqCargarLista_(){
  const cont = document.getElementById("tgmReqLista");
  cont.innerHTML = '<div class="tgmVacio">Cargando…</div>';
  google.script.run
    .withSuccessHandler(function(lista){
      let filtrada = lista;
      if(TGM_REQ_TAB === "pendientes") filtrada = lista.filter(function(r){ return r.estado === "PENDIENTE"; });
      if(TGM_REQ_TAB === "entregadas") filtrada = lista.filter(function(r){ return r.estado === "ENTREGADA"; });
      tgmDibujarListaRequisiciones_(filtrada);
    })
    .withFailureHandler(function(e){ cont.innerHTML = '<div class="tgmVacio">' + (e.message || "No se pudo cargar") + '</div>'; })
    .obtenerRequisicionesApp(tgmObtenerToken());
}

function tgmClaseEstadoRequisicion_(estado){
  if(estado === "PENDIENTE") return "tgmEstado-pendiente";
  if(estado === "ENTREGADA") return "tgmEstado-surtida";
  return "tgmEstado-cancelada";
}

function tgmDibujarListaRequisiciones_(lista){
  const cont = document.getElementById("tgmReqLista");
  if(!lista || !lista.length){
    cont.innerHTML = '<div class="tgmVacio">' + tgmIcon("carrito", 40) + '<div style="margin-top:10px">No hay requisiciones en esta pestaña</div></div>';
    return;
  }
  cont.innerHTML = lista.map(function(r){
    const folioEscapado = String(r.folio).replace(/'/g, "\\'");
    return '<div class="tgmCard tgmCardTappable" onclick="tgmAbrirDetalleRequisicion_(\'' + folioEscapado + '\')">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">' +
        '<div style="font-weight:800;font-size:15px">' + r.folio + '</div>' +
        '<span class="tgmEstado ' + tgmClaseEstadoRequisicion_(r.estado) + '">' + r.estado + '</span>' +
      '</div>' +
      '<div style="font-size:12.5px;color:var(--text-muted);margin-top:6px">Área: ' + r.area + '</div>' +
      '<div style="font-size:12.5px;color:var(--text-muted)">Solicitante: ' + r.solicitante + '</div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">' +
        '<span style="font-size:11.5px;color:var(--text-muted)">' + r.fecha + '</span>' +
        '<span class="tgmChevron">' + tgmIcon("chevronDerecha", 18) + '</span>' +
      '</div>' +
    '</div>';
  }).join("");
}

function tgmAbrirDetalleRequisicion_(folio){
  document.getElementById("tgmHeader").innerHTML =
    '<button class="tgmHeaderVolver" onclick="tgmAbrirRequisiciones()">' + tgmIcon("chevronIzquierda", 22) + '</button>' +
    '<div class="tgmHeaderTitulo">' + folio + '</div>' +
    tgmHeaderAccionesHtml_();
  document.getElementById("tgmContenido").innerHTML = '<div class="tgmVacio">Cargando…</div>';

  google.script.run
    .withSuccessHandler(function(detalle){
      TGM_REQ_DETALLE = detalle;
      tgmDibujarDetalleRequisicion_(detalle);
    })
    .withFailureHandler(function(e){
      document.getElementById("tgmContenido").innerHTML = '<div class="tgmVacio">' + (e.message || "No se pudo cargar la requisición") + '</div>';
    })
    .obtenerDetalleRequisicionApp(folio, tgmObtenerToken());
}

function tgmDibujarDetalleRequisicion_(d){

  const puedeSurtir = TGM_REQ_ACCESO && TGM_REQ_ACCESO.esAdmin && d.estado === "PENDIENTE";

  document.getElementById("tgmContenido").innerHTML =
    '<div class="tgmCard">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">' +
        '<div>' +
          '<div style="font-weight:800;font-size:16px">' + d.folio + '</div>' +
          '<div style="font-size:12.5px;color:var(--text-muted);margin-top:2px">Área: ' + d.area + '</div>' +
        '</div>' +
        '<span class="tgmEstado ' + tgmClaseEstadoRequisicion_(d.estado) + '">' + d.estado + '</span>' +
      '</div>' +
      '<div style="font-size:12.5px;color:var(--text-muted);margin-top:10px">Solicitante: ' + d.solicitante + '</div>' +
      '<div style="font-size:12.5px;color:var(--text-muted)">Fecha: ' + d.fecha + '</div>' +
      (d.observaciones ? '<div style="font-size:12.5px;color:var(--text-muted);margin-top:4px">Obs: ' + d.observaciones + '</div>' : '') +
    '</div>' +
    '<div class="tgmSeccionTitulo">Productos (' + d.items.length + ')</div>' +
    d.items.map(function(it){
      const pendiente = Math.max(0, it.solicitado - (Number(it.entregado) || 0));
      return '<div class="tgmCard">' +
        '<div style="font-weight:700;font-size:14px">' + it.producto + '</div>' +
        '<div style="font-size:11.5px;color:var(--text-muted)">' + it.codigo + (it.ubicacion ? ' · ' + it.ubicacion : '') + '</div>' +
        '<div style="display:flex;gap:18px;margin-top:8px;font-size:12.5px">' +
          '<div><span style="color:var(--text-muted)">Solicitado</span><br><b>' + it.solicitado + ' ' + it.unidad + '</b></div>' +
          '<div><span style="color:var(--text-muted)">Existencia</span><br><b>' + it.existencia + '</b></div>' +
          '<div><span style="color:var(--text-muted)">' + (d.estado === "ENTREGADA" ? "Entregado" : "Pendiente") + '</span><br><b>' + (d.estado === "ENTREGADA" ? (it.entregado || 0) : pendiente) + '</b></div>' +
        '</div>' +
      '</div>';
    }).join("") +
    (puedeSurtir ? '<button class="tgmBotonPrimario" onclick="tgmIniciarSurtido_()">' + tgmIcon("checkCirculo", 18) + ' Surtir requisición</button>' : '');

}

function tgmIniciarSurtido_(){

  if(!TGM_REQ_DETALLE || !TGM_REQ_DETALLE.items.length) return;

  TGM_SURTIDO_FOLIO = TGM_REQ_DETALLE.folio;
  TGM_SURTIDO_ITEMS = TGM_REQ_DETALLE.items.slice();
  TGM_SURTIDO_INDICE = 0;
  TGM_SURTIDO_ENTREGAS = [];

  document.getElementById("tgmHeader").innerHTML =
    '<button class="tgmHeaderVolver" onclick="tgmAbrirDetalleRequisicion_(\'' + TGM_SURTIDO_FOLIO.replace(/'/g,"\\'") + '\')">' + tgmIcon("chevronIzquierda", 22) + '</button>' +
    '<div class="tgmHeaderTitulo">Surtido</div>' +
    tgmHeaderAccionesHtml_();

  tgmDibujarSurtidoActual_();

}

function tgmDibujarSurtidoActual_(){

  const total = TGM_SURTIDO_ITEMS.length;
  const it = TGM_SURTIDO_ITEMS[TGM_SURTIDO_INDICE];
  const pct = total ? Math.round((TGM_SURTIDO_INDICE / total) * 100) : 0;

  document.getElementById("tgmContenido").innerHTML =
    '<div style="display:flex;justify-content:space-between;font-weight:800;font-size:13.5px"><span>' + TGM_SURTIDO_FOLIO + '</span><span>' + TGM_SURTIDO_INDICE + '/' + total + '</span></div>' +
    '<div class="tgmProgreso"><div class="tgmProgresoRelleno" style="width:' + pct + '%"></div></div>' +
    '<div class="tgmMensaje" id="tgmSurtidoMensaje" style="margin-top:14px"></div>' +
    '<div class="tgmSeccionTitulo">Producto ' + (TGM_SURTIDO_INDICE + 1) + ' de ' + total + '</div>' +
    '<div class="tgmCard">' +
      '<div style="font-weight:700;font-size:15px">' + it.producto + '</div>' +
      '<div style="font-size:12px;color:var(--text-muted)">' + it.codigo + (it.ubicacion ? ' · ' + it.ubicacion : '') + '</div>' +
    '</div>' +
    '<div class="tgmDetalleGrid">' +
      '<div class="tgmDetalleItem"><div class="lbl">Solicitado</div><div class="val">' + it.solicitado + ' ' + it.unidad + '</div></div>' +
      '<div class="tgmDetalleItem"><div class="lbl">Disponible</div><div class="val">' + it.existencia + '</div></div>' +
    '</div>' +
    '<div class="tgmCampo"><label>Cantidad a surtir</label><input type="number" id="tgmSurtidoCantidad" inputmode="decimal" value="' + it.entregarSugerido + '"></div>' +
    '<button class="tgmBotonPrimario" id="tgmSurtidoBtnConfirmar" onclick="tgmConfirmarSurtido_()">' + tgmIcon("chevronDerecha", 18) + ' Confirmar y siguiente</button>' +
    '<button class="tgmBotonSecundario" style="margin-top:10px" onclick="tgmSurtidoNoDisponible_()">No disponible</button>';

  document.getElementById("tgmSurtidoCantidad").focus();

}

function tgmConfirmarSurtido_(){
  const it = TGM_SURTIDO_ITEMS[TGM_SURTIDO_INDICE];
  const cantidad = document.getElementById("tgmSurtidoCantidad").value;
  if(cantidad === "" || Number(cantidad) < 0){
    tgmMensaje_("tgmSurtidoMensaje", "Captura una cantidad válida", "error");
    return;
  }
  if(Number(cantidad) > 0){
    TGM_SURTIDO_ENTREGAS.push({ codigo: it.codigo, cantidadEntregada: Number(cantidad) });
  }
  tgmSurtidoAvanzar_();
}

function tgmSurtidoNoDisponible_(){
  tgmSurtidoAvanzar_();
}

function tgmSurtidoAvanzar_(){
  TGM_SURTIDO_INDICE++;
  if(TGM_SURTIDO_INDICE >= TGM_SURTIDO_ITEMS.length){
    tgmFinalizarSurtido_();
    return;
  }
  tgmDibujarSurtidoActual_();
}

function tgmFinalizarSurtido_(){

  document.getElementById("tgmContenido").innerHTML = '<div class="tgmVacio">Guardando entrega…</div>';

  if(!TGM_SURTIDO_ENTREGAS.length){
    document.getElementById("tgmContenido").innerHTML =
      '<div class="tgmVacio">No se capturó ninguna cantidad a entregar — nada se guardó.</div>' +
      '<button class="tgmBotonSecundario" onclick="tgmAbrirDetalleRequisicion_(\'' + TGM_SURTIDO_FOLIO.replace(/'/g,"\\'") + '\')">Volver al detalle</button>';
    return;
  }

  google.script.run
    .withSuccessHandler(function(){
      document.getElementById("tgmContenido").innerHTML =
        '<div class="tgmVacio">' + tgmIcon("checkCirculo", 40) +
          '<div style="margin-top:10px;font-weight:700">Surtido completado</div>' +
          '<div style="font-size:12.5px;margin-top:4px">' + TGM_SURTIDO_FOLIO + ' — entrega registrada</div>' +
        '</div>' +
        '<button class="tgmBotonSecundario" onclick="tgmAbrirRequisiciones()">Volver a Requisiciones</button>';
    })
    .withFailureHandler(function(e){
      document.getElementById("tgmContenido").innerHTML =
        '<div class="tgmVacio">' + (e.message || "No se pudo confirmar la entrega") + '</div>' +
        '<button class="tgmBotonSecundario" onclick="tgmAbrirDetalleRequisicion_(\'' + TGM_SURTIDO_FOLIO.replace(/'/g,"\\'") + '\')">Volver al detalle</button>';
    })
    .confirmarEntregaRequisicionApp(TGM_SURTIDO_FOLIO, TGM_SURTIDO_ENTREGAS, tgmObtenerToken());

}
// ============================================
// Utilidades compartidas por los formularios (Entrada, Salida, y las
// que sigan) — mensaje de confirmación/error con auto-cierre, y estado
// de "guardando" en el botón principal para evitar doble envío.
// ============================================
function tgmMensaje_(idContenedor, texto, tipo){
  const el = document.getElementById(idContenedor);
  if(!el) return;
  el.textContent = texto;
  el.className = "tgmMensaje " + (tipo === "error" ? "error" : "ok");
  clearTimeout(el._tgmTimer);
  el._tgmTimer = setTimeout(function(){ el.style.display = "none"; }, 3500);
}

function tgmBotonCargando_(idBoton, cargando, htmlNormal){
  const btn = document.getElementById(idBoton);
  if(!btn) return;
  btn.disabled = cargando;
  btn.innerHTML = cargando ? "Guardando…" : htmlNormal;
}

// ============================================
// ENTRADA — mismos campos y mismo endpoint (guardarEntradaApp) que la
// pantalla de Desktop (abrirEntradas en index.html): código, producto,
// cantidad, UDM, lote, caducidad, ubicación. Desktop tampoco captura
// proveedor en este flujo (no existe esa columna en guardarEntradaApp),
// así que Mobile no lo inventa aquí tampoco.
// ============================================
function tgmAbrirEntrada(codigoPrefill){

  tgmRenderHeaderPantalla("Entrada", true);

  document.getElementById("tgmContenido").innerHTML =
    '<div class="tgmMensaje" id="tgmEntradaMensaje"></div>' +
    '<div class="tgmCampo tgmCampoConIcono">' +
      '<label>Código</label>' +
      '<input type="text" id="tgmEntradaCodigo" placeholder="Escanear o escribir código" onchange="tgmBuscarProductoEntrada_()">' +
      '<button type="button" class="tgmCampoIcono" onclick="tgmEntradaEscanear_()" title="Escanear">' + tgmIcon("camara", 18) + '</button>' +
    '</div>' +
    '<div class="tgmCampo"><label>Producto</label><input type="text" id="tgmEntradaProducto" readonly></div>' +
    '<div class="tgmCampo"><label>Cantidad</label><input type="number" id="tgmEntradaCantidad" placeholder="0" inputmode="decimal"></div>' +
    '<div class="tgmCampo"><label>UDM</label><input type="text" id="tgmEntradaUdm" placeholder="KG, PZ, L..."></div>' +
    '<div class="tgmCampo"><label>Ubicación</label><input type="text" id="tgmEntradaUbicacion" placeholder="Rack - Nivel - Posición"></div>' +
    '<div class="tgmCampo"><label>Lote (opcional)</label><input type="text" id="tgmEntradaLote"></div>' +
    '<div class="tgmCampo"><label>Caducidad (opcional)</label><input type="date" id="tgmEntradaCaducidad"></div>' +
    '<button class="tgmBotonPrimario" id="tgmEntradaBtnConfirmar" onclick="tgmGuardarEntrada_()">' + tgmIcon("checkCirculo", 18) + ' Confirmar entrada</button>';

  if(codigoPrefill){
    document.getElementById("tgmEntradaCodigo").value = codigoPrefill;
    tgmBuscarProductoEntrada_();
  } else {
    document.getElementById("tgmEntradaCodigo").focus();
  }

}

function tgmBuscarProductoEntrada_(){
  const codigo = document.getElementById("tgmEntradaCodigo").value.trim();
  if(!codigo) return;
  google.script.run
    .withSuccessHandler(function(producto){
      if(!producto){
        tgmMensaje_("tgmEntradaMensaje", "Producto no encontrado — puedes capturarlo manualmente", "error");
        return;
      }
      document.getElementById("tgmEntradaProducto").value = producto.producto;
      document.getElementById("tgmEntradaUdm").value = producto.udm;
      document.getElementById("tgmEntradaUbicacion").value = producto.ubicacion === "Sin ubicación" ? "" : producto.ubicacion;
      document.getElementById("tgmEntradaCantidad").focus();
    })
    .withFailureHandler(function(e){ tgmMensaje_("tgmEntradaMensaje", e.message, "error"); })
    .buscarProductoApp(codigo, tgmObtenerToken());
}

function tgmEntradaEscanear_(){
  tgmAbrirEscaner({ titulo: "Escanear producto", onDetectado: function(codigo){
    document.getElementById("tgmEntradaCodigo").value = codigo;
    tgmBuscarProductoEntrada_();
  }});
}

function tgmGuardarEntrada_(){

  const datos = {
    codigo: document.getElementById("tgmEntradaCodigo").value.trim(),
    producto: document.getElementById("tgmEntradaProducto").value.trim(),
    cantidad: document.getElementById("tgmEntradaCantidad").value,
    udm: document.getElementById("tgmEntradaUdm").value.trim(),
    lote: document.getElementById("tgmEntradaLote").value.trim(),
    caducidad: document.getElementById("tgmEntradaCaducidad").value,
    ubicacion: document.getElementById("tgmEntradaUbicacion").value.trim(),
    token: tgmObtenerToken()
  };

  if(!datos.codigo || !datos.cantidad || Number(datos.cantidad) <= 0){
    tgmMensaje_("tgmEntradaMensaje", "Completa código y una cantidad válida", "error");
    return;
  }

  tgmBotonCargando_("tgmEntradaBtnConfirmar", true);

  google.script.run
    .withSuccessHandler(function(){
      tgmBotonCargando_("tgmEntradaBtnConfirmar", false, tgmIcon("checkCirculo", 18) + " Confirmar entrada");
      tgmMensaje_("tgmEntradaMensaje", "✓ Entrada registrada — listo para el siguiente producto", "ok");
      ["tgmEntradaCodigo","tgmEntradaProducto","tgmEntradaCantidad","tgmEntradaUdm","tgmEntradaUbicacion","tgmEntradaLote","tgmEntradaCaducidad"]
        .forEach(function(id){ document.getElementById(id).value = ""; });
      document.getElementById("tgmEntradaCodigo").focus();
    })
    .withFailureHandler(function(e){
      tgmBotonCargando_("tgmEntradaBtnConfirmar", false, tgmIcon("checkCirculo", 18) + " Confirmar entrada");
      tgmMensaje_("tgmEntradaMensaje", e.message, "error");
    })
    .guardarEntradaApp(datos);

}

// ============================================
// SALIDA — mismos campos y mismo endpoint (registrarSalidaApp) que
// Desktop (abrirSalidas): código, producto/existencia/UDM de solo
// lectura (vienen del catálogo), cantidad, lote, área de salida (mismas
// 3 opciones que ya usa Desktop — no es un catálogo nuevo, es el mismo
// dato), ubicación de solo lectura. Flujo deliberadamente corto:
// Escanear → Cantidad → Confirmar.
// ============================================
function tgmAbrirSalida(codigoPrefill){

  tgmRenderHeaderPantalla("Salida", true);

  document.getElementById("tgmContenido").innerHTML =
    '<div class="tgmMensaje" id="tgmSalidaMensaje"></div>' +
    '<div class="tgmCampo tgmCampoConIcono">' +
      '<label>Código</label>' +
      '<input type="text" id="tgmSalidaCodigo" placeholder="Escanear o escribir código" onchange="tgmBuscarProductoSalida_()">' +
      '<button type="button" class="tgmCampoIcono" onclick="tgmSalidaEscanear_()" title="Escanear">' + tgmIcon("camara", 18) + '</button>' +
    '</div>' +
    '<div class="tgmCampo"><label>Producto</label><input type="text" id="tgmSalidaProducto" readonly></div>' +
    '<div class="tgmCampo"><label>Existencia disponible</label><input type="text" id="tgmSalidaExistencia" readonly></div>' +
    '<div class="tgmCampo"><label>Cantidad a retirar</label><input type="number" id="tgmSalidaCantidad" placeholder="0" inputmode="decimal"></div>' +
    '<div class="tgmCampo"><label>UDM</label><input type="text" id="tgmSalidaUdm" readonly></div>' +
    '<div class="tgmCampo"><label>Lote (opcional)</label><input type="text" id="tgmSalidaLote"></div>' +
    '<div class="tgmCampo"><label>Área de salida</label>' +
      '<select id="tgmSalidaArea">' +
        '<option value="">Seleccionar área</option>' +
        '<option value="Cocina">Cocina</option>' +
        '<option value="Panaderia">Panaderia</option>' +
        '<option value="Reposteria">Reposteria</option>' +
      '</select>' +
    '</div>' +
    '<div class="tgmCampo"><label>Ubicación</label><input type="text" id="tgmSalidaUbicacion" readonly></div>' +
    '<button class="tgmBotonPrimario" id="tgmSalidaBtnConfirmar" onclick="tgmGuardarSalida_()">' + tgmIcon("checkCirculo", 18) + ' Confirmar salida</button>';

  if(codigoPrefill){
    document.getElementById("tgmSalidaCodigo").value = codigoPrefill;
    tgmBuscarProductoSalida_();
  } else {
    document.getElementById("tgmSalidaCodigo").focus();
  }

}

function tgmBuscarProductoSalida_(){
  const codigo = document.getElementById("tgmSalidaCodigo").value.trim();
  if(!codigo) return;
  google.script.run
    .withSuccessHandler(function(producto){
      if(!producto){
        tgmMensaje_("tgmSalidaMensaje", "Producto no encontrado", "error");
        return;
      }
      document.getElementById("tgmSalidaProducto").value = producto.producto;
      document.getElementById("tgmSalidaUdm").value = producto.udm;
      document.getElementById("tgmSalidaUbicacion").value = producto.ubicacion === "Sin ubicación" ? "" : producto.ubicacion;
      document.getElementById("tgmSalidaExistencia").value = producto.existencia + " " + producto.udm;
      document.getElementById("tgmSalidaCantidad").focus();
    })
    .withFailureHandler(function(e){ tgmMensaje_("tgmSalidaMensaje", e.message, "error"); })
    .buscarProductoApp(codigo, tgmObtenerToken());
}

function tgmSalidaEscanear_(){
  tgmAbrirEscaner({ titulo: "Escanear producto", onDetectado: function(codigo){
    document.getElementById("tgmSalidaCodigo").value = codigo;
    tgmBuscarProductoSalida_();
  }});
}

function tgmGuardarSalida_(){

  const datos = {
    codigo: document.getElementById("tgmSalidaCodigo").value.trim(),
    producto: document.getElementById("tgmSalidaProducto").value.trim(),
    cantidad: document.getElementById("tgmSalidaCantidad").value,
    udm: document.getElementById("tgmSalidaUdm").value.trim(),
    lote: document.getElementById("tgmSalidaLote").value.trim(),
    area: document.getElementById("tgmSalidaArea").value,
    ubicacion: document.getElementById("tgmSalidaUbicacion").value.trim(),
    token: tgmObtenerToken()
  };

  if(!datos.codigo || !datos.cantidad || Number(datos.cantidad) <= 0){
    tgmMensaje_("tgmSalidaMensaje", "Completa código y una cantidad válida", "error");
    return;
  }

  tgmBotonCargando_("tgmSalidaBtnConfirmar", true);

  google.script.run
    .withSuccessHandler(function(resultado){
      tgmBotonCargando_("tgmSalidaBtnConfirmar", false, tgmIcon("checkCirculo", 18) + " Confirmar salida");
      tgmMensaje_("tgmSalidaMensaje", "✓ Salida registrada — existencia restante: " + resultado.existenciaRestante, "ok");
      ["tgmSalidaCodigo","tgmSalidaProducto","tgmSalidaExistencia","tgmSalidaCantidad","tgmSalidaUdm","tgmSalidaLote","tgmSalidaUbicacion"]
        .forEach(function(id){ document.getElementById(id).value = ""; });
      document.getElementById("tgmSalidaArea").value = "";
      document.getElementById("tgmSalidaCodigo").focus();
    })
    .withFailureHandler(function(e){
      tgmBotonCargando_("tgmSalidaBtnConfirmar", false, tgmIcon("checkCirculo", 18) + " Confirmar salida");
      tgmMensaje_("tgmSalidaMensaje", e.message, "error");
    })
    .registrarSalidaApp(datos);

}

// ============================================
// INVENTARIO — búsqueda (nombre/código/rack/ubicación) + 3 pestañas
// (Productos/Racks/Ubicaciones). Un solo endpoint nuevo del lado del
// servidor (obtenerInventarioMovilApp) cubre búsqueda libre y filtro
// exacto por rack; obtenerRacksConteoApp y obtenerUbicacionesUnicasApp
// alimentan las otras 2 pestañas. Ningún cálculo de existencia/estado
// se duplica aquí — todo llega ya calculado del servidor.
// ============================================
let TGM_INV_SUBTAB = "productos";
let TGM_INV_TEXTO = "";
let TGM_INV_RACK_ACTIVO = null;
let tgmInvBuscarTimer = null;

function tgmAbrirInventario(){

  TGM_TAB_ACTIVA = "inventario";
  tgmRenderNavInferior();
  tgmRenderHeaderRaiz("Inventario");

  TGM_INV_SUBTAB = "productos";
  TGM_INV_TEXTO = "";
  TGM_INV_RACK_ACTIVO = null;

  document.getElementById("tgmContenido").innerHTML =
    '<div class="tgmBuscador">' +
      '<span class="tgmBuscadorLupa">' + tgmIcon("buscar", 18) + '</span>' +
      '<input type="text" id="tgmInvBuscador" placeholder="Buscar producto, código o rack..." oninput="tgmInvBuscar_(this.value)">' +
      '<button class="tgmBuscadorEscaner" onclick="tgmInvEscanear_()" title="Escanear">' + tgmIcon("camara", 18) + '</button>' +
    '</div>' +
    '<div class="tgmTabs">' +
      '<button class="tgmTab activa" onclick="tgmInvCambiarTab_(\'productos\')">Productos</button>' +
      '<button class="tgmTab" onclick="tgmInvCambiarTab_(\'racks\')">Racks</button>' +
      '<button class="tgmTab" onclick="tgmInvCambiarTab_(\'ubicaciones\')">Ubicaciones</button>' +
    '</div>' +
    '<div class="tgmSeccionTitulo" id="tgmInvSeccionTitulo">Productos</div>' +
    '<div id="tgmInvContenido"></div>';

  tgmInvCargar_();

}

function tgmInvActualizarTabsActivas_(){
  const orden = ["productos", "racks", "ubicaciones"];
  const botones = document.querySelectorAll("#tgmContenido .tgmTabs .tgmTab");
  botones.forEach(function(btn, idx){
    btn.classList.toggle("activa", orden[idx] === TGM_INV_SUBTAB);
  });
}

function tgmInvTituloProductos_(){
  if(TGM_INV_RACK_ACTIVO){
    return "Rack " + TGM_INV_RACK_ACTIVO +
      '<button class="tgmFiltroQuitar" onclick="tgmInvLimpiarFiltro_()">Quitar filtro ✕</button>';
  }
  if(TGM_INV_TEXTO) return "Resultados de búsqueda";
  return "Productos";
}

function tgmInvCargar_(){

  const cont = document.getElementById("tgmInvContenido");
  const titulo = document.getElementById("tgmInvSeccionTitulo");
  cont.innerHTML = '<div class="tgmVacio">Cargando…</div>';

  if(TGM_INV_SUBTAB === "racks"){
    titulo.textContent = "Racks del almacén";
    google.script.run
      .withSuccessHandler(tgmDibujarRacks_)
      .withFailureHandler(tgmInvError_)
      .obtenerRacksConteoApp(tgmObtenerToken());
    return;
  }

  if(TGM_INV_SUBTAB === "ubicaciones"){
    titulo.textContent = "Ubicaciones registradas";
    google.script.run
      .withSuccessHandler(tgmDibujarUbicaciones_)
      .withFailureHandler(tgmInvError_)
      .obtenerUbicacionesUnicasApp(tgmObtenerToken());
    return;
  }

  titulo.innerHTML = tgmInvTituloProductos_();
  google.script.run
    .withSuccessHandler(tgmDibujarProductos_)
    .withFailureHandler(tgmInvError_)
    .obtenerInventarioMovilApp({ texto: TGM_INV_TEXTO, rack: TGM_INV_RACK_ACTIVO || "", limite: 30 }, tgmObtenerToken());

}

function tgmInvError_(e){
  document.getElementById("tgmInvContenido").innerHTML = '<div class="tgmVacio">' + (e && e.message ? e.message : "No se pudo cargar la información") + '</div>';
}

function tgmInvCambiarTab_(tab){
  TGM_INV_SUBTAB = tab;
  TGM_INV_TEXTO = "";
  TGM_INV_RACK_ACTIVO = null;
  const input = document.getElementById("tgmInvBuscador");
  if(input) input.value = "";
  tgmInvActualizarTabsActivas_();
  tgmInvCargar_();
}

function tgmInvBuscar_(valor){
  TGM_INV_TEXTO = valor;
  TGM_INV_RACK_ACTIVO = null;
  if(TGM_INV_SUBTAB !== "productos"){
    TGM_INV_SUBTAB = "productos";
    tgmInvActualizarTabsActivas_();
  }
  clearTimeout(tgmInvBuscarTimer);
  tgmInvBuscarTimer = setTimeout(function(){
    document.getElementById("tgmInvSeccionTitulo").innerHTML = tgmInvTituloProductos_();
    tgmInvCargar_();
  }, 300);
}

function tgmInvLimpiarFiltro_(){
  TGM_INV_TEXTO = "";
  TGM_INV_RACK_ACTIVO = null;
  const input = document.getElementById("tgmInvBuscador");
  if(input) input.value = "";
  document.getElementById("tgmInvSeccionTitulo").innerHTML = tgmInvTituloProductos_();
  tgmInvCargar_();
}

function tgmInvFiltrarPorRack_(rack){
  TGM_INV_SUBTAB = "productos";
  TGM_INV_TEXTO = "";
  TGM_INV_RACK_ACTIVO = rack;
  const input = document.getElementById("tgmInvBuscador");
  if(input) input.value = "";
  tgmInvActualizarTabsActivas_();
  document.getElementById("tgmInvSeccionTitulo").innerHTML = tgmInvTituloProductos_();
  tgmInvCargar_();
}

function tgmInvFiltrarPorUbicacion_(ubicacion){
  TGM_INV_SUBTAB = "productos";
  TGM_INV_RACK_ACTIVO = null;
  TGM_INV_TEXTO = ubicacion;
  const input = document.getElementById("tgmInvBuscador");
  if(input) input.value = ubicacion;
  tgmInvActualizarTabsActivas_();
  document.getElementById("tgmInvSeccionTitulo").innerHTML = tgmInvTituloProductos_();
  tgmInvCargar_();
}

function tgmInvEscanear_(){
  tgmAbrirEscaner({ titulo: "Escanear producto", onDetectado: function(codigo){
    TGM_INV_SUBTAB = "productos";
    TGM_INV_RACK_ACTIVO = null;
    TGM_INV_TEXTO = codigo;
    const input = document.getElementById("tgmInvBuscador");
    if(input) input.value = codigo;
    tgmInvActualizarTabsActivas_();
    document.getElementById("tgmInvSeccionTitulo").innerHTML = tgmInvTituloProductos_();
    tgmInvCargar_();
  }});
}

function tgmClaseEstado_(estado){
  if(estado === "Agotado") return "tgmEstado-cancelada";
  if(estado === "Bajo") return "tgmEstado-pendiente";
  return "tgmEstado-aprobada";
}

function tgmDibujarProductos_(lista){
  const cont = document.getElementById("tgmInvContenido");
  if(!lista || !lista.length){
    cont.innerHTML = '<div class="tgmVacio">' + tgmIcon("paquete", 40) + '<div style="margin-top:10px">No se encontraron productos</div></div>';
    return;
  }
  cont.innerHTML = lista.map(function(p){
    const codigoEscapado = String(p.codigo).replace(/'/g, "\\'");
    return '<div class="tgmCard tgmCardTappable" onclick="tgmAbrirDetalleProducto(\'' + codigoEscapado + '\')">' +
      '<div style="display:flex;gap:12px;align-items:flex-start">' +
        '<div style="width:40px;height:40px;border-radius:10px;background:var(--color-danger-bg);color:var(--guinda);display:flex;align-items:center;justify-content:center;flex-shrink:0">' + tgmIcon("paquete", 20) + '</div>' +
        '<div style="flex:1;min-width:0">' +
          '<div style="font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + p.producto + '</div>' +
          '<div style="font-size:12px;color:var(--text-muted)">' + p.codigo + '</div>' +
        '</div>' +
        '<div style="text-align:right;flex-shrink:0">' +
          '<div style="font-weight:800;font-size:15.5px;white-space:nowrap">' + p.existencia + ' <span style="font-size:11.5px;font-weight:700">' + p.udm + '</span></div>' +
        '</div>' +
        '<span class="tgmChevron">' + tgmIcon("chevronDerecha", 18) + '</span>' +
      '</div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-left:52px;gap:8px">' +
        '<div style="font-size:11.5px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
          (p.rack ? p.rack + ' · ' : '') + p.ubicacion + ' · Mín ' + p.minimo + ' Máx ' + p.maximo +
        '</div>' +
        '<span class="tgmEstado ' + tgmClaseEstado_(p.estado) + '" style="flex-shrink:0">' + p.estado + '</span>' +
      '</div>' +
    '</div>';
  }).join("");
}

function tgmDibujarRacks_(racks){
  const cont = document.getElementById("tgmInvContenido");
  if(!racks || !racks.length){
    cont.innerHTML = '<div class="tgmVacio">No hay racks registrados</div>';
    return;
  }
  cont.innerHTML = racks.map(function(r){
    const escapado = String(r).replace(/'/g, "\\'");
    return '<div class="tgmCard tgmCardTappable" onclick="tgmInvFiltrarPorRack_(\'' + escapado + '\')" style="display:flex;align-items:center;gap:12px">' +
      '<div style="width:40px;height:40px;border-radius:10px;background:var(--color-info-bg);color:var(--color-info);display:flex;align-items:center;justify-content:center;flex-shrink:0">' + tgmIcon("ubicacion", 20) + '</div>' +
      '<div style="flex:1;font-weight:700">' + r + '</div>' +
      '<span class="tgmChevron">' + tgmIcon("chevronDerecha", 18) + '</span>' +
    '</div>';
  }).join("");
}

function tgmDibujarUbicaciones_(lista){
  const cont = document.getElementById("tgmInvContenido");
  if(!lista || !lista.length){
    cont.innerHTML = '<div class="tgmVacio">No hay ubicaciones registradas</div>';
    return;
  }
  cont.innerHTML = lista.map(function(u){
    const escapado = String(u).replace(/'/g, "\\'");
    return '<div class="tgmCard tgmCardTappable" onclick="tgmInvFiltrarPorUbicacion_(\'' + escapado + '\')" style="display:flex;align-items:center;gap:12px">' +
      '<div style="width:40px;height:40px;border-radius:10px;background:var(--color-info-bg);color:var(--color-info);display:flex;align-items:center;justify-content:center;flex-shrink:0">' + tgmIcon("ubicacion", 20) + '</div>' +
      '<div style="flex:1;font-weight:700">' + u + '</div>' +
      '<span class="tgmChevron">' + tgmIcon("chevronDerecha", 18) + '</span>' +
    '</div>';
  }).join("");
}

// ============================================
// FICHA DE PRODUCTO — hoja inferior compartida por Inventario (tap en
// tarjeta) y el Escáner (detección exitosa desde el atajo de Inicio, el
// buscador de Inventario, o cualquier otro punto de entrada futuro).
// ============================================
function tgmAbrirDetalleProducto(codigo){
  document.getElementById("tgmHojaFondo").classList.add("mostrar");
  document.getElementById("tgmHojaDetalleProducto").classList.add("mostrar");
  document.getElementById("tgmDetalleNombre").textContent = "Cargando…";
  document.getElementById("tgmDetalleCodigo").textContent = codigo;
  document.getElementById("tgmDetalleContenido").innerHTML =
    '<div class="tgmSkeleton" style="height:16px;width:50%"></div>' +
    '<div class="tgmSkeleton" style="height:70px;margin-top:10px"></div>';

  google.script.run
    .withSuccessHandler(function(producto){
      if(!producto){
        document.getElementById("tgmDetalleNombre").textContent = "No encontrado";
        document.getElementById("tgmDetalleContenido").innerHTML = '<div class="tgmVacio">No se encontró ningún producto con este código.</div>';
        return;
      }
      tgmDibujarDetalleProducto_(producto);
    })
    .withFailureHandler(function(e){
      document.getElementById("tgmDetalleContenido").innerHTML = '<div class="tgmVacio">' + (e && e.message ? e.message : "No se pudo cargar el producto") + '</div>';
    })
    .obtenerDetalleProductoApp(codigo, tgmObtenerToken());
}

function tgmDibujarDetalleProducto_(p){
  document.getElementById("tgmDetalleNombre").textContent = p.producto;
  document.getElementById("tgmDetalleCodigo").textContent = p.codigo;

  const estado = p.existencia <= 0 ? "Agotado" : (p.existencia <= p.minimo ? "Bajo" : "Óptimo");
  const codigoEscapado = String(p.codigo).replace(/'/g, "\\'");

  document.getElementById("tgmDetalleContenido").innerHTML =
    '<span class="tgmEstado ' + tgmClaseEstado_(estado) + '">' + (estado === "Bajo" ? "Bajo mínimo" : estado) + '</span>' +
    '<div class="tgmUbicacionDestacada">' + tgmIcon("ubicacion", 20) +
      '<span>' + (p.rack ? p.rack + ' — ' : '') + p.ubicacion + '</span>' +
    '</div>' +
    '<div class="tgmDetalleGrid">' +
      '<div class="tgmDetalleItem"><div class="lbl">Existencia</div><div class="val">' + p.existencia + ' ' + p.udm + '</div></div>' +
      '<div class="tgmDetalleItem"><div class="lbl">Mínimo / Máximo</div><div class="val">' + p.minimo + ' / ' + p.maximo + '</div></div>' +
      '<div class="tgmDetalleItem"><div class="lbl">Proveedor</div><div class="val" style="font-size:13.5px">' + (p.proveedor || "—") + '</div></div>' +
      '<div class="tgmDetalleItem"><div class="lbl">Último ingreso</div><div class="val" style="font-size:13.5px">' + (p.ultimoIngreso || "—") + '</div></div>' +
    '</div>' +
    (USUARIO_ACTUAL.rol !== "CONSULTA" ?
      '<div class="tgmHojaAcciones">' +
        '<button class="tgmHojaAccionBtn" onclick="tgmCerrarDetalleProducto();tgmAbrirEntrada(\'' + codigoEscapado + '\')">' + tgmIcon("entrada", 20) + 'Entrada</button>' +
        '<button class="tgmHojaAccionBtn" onclick="tgmCerrarDetalleProducto();tgmAbrirSalida(\'' + codigoEscapado + '\')">' + tgmIcon("salida", 20) + 'Salida</button>' +
        '<button class="tgmHojaAccionBtn" onclick="tgmCerrarDetalleProducto();tgmAbrirConteo()">' + tgmIcon("documento", 20) + 'Contar</button>' +
      '</div>'
      : '');
}

function tgmCerrarDetalleProducto(){
  document.getElementById("tgmHojaFondo").classList.remove("mostrar");
  document.getElementById("tgmHojaDetalleProducto").classList.remove("mostrar");
}

// ============================================
// BOOTSTRAP
// ============================================
window.addEventListener("load", function(){
  tgmVerificarSesion(function(){
    tgmAbrirInicio();
  });
});
</script>
