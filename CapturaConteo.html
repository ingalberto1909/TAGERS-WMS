<!DOCTYPE html>
<html>

<head>

<style>

body{
font-family:Arial,Helvetica,sans-serif;
padding:20px;
background:#f1f5f9;
}


h2{
color:#1565c0;
}


input{

width:100%;
padding:12px;
font-size:18px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #ccc;

}


.card{

background:white;
padding:20px;
border-radius:12px;
margin-top:15px;
box-shadow:0 3px 10px rgba(0,0,0,.15);

}


button{

width:100%;
padding:12px;
background:#1565c0;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;

}


button:hover{

opacity:.85;

}


.verde{

background:#16a34a;

}


.rojo{

color:red;

}

</style>

</head>


<body>


<h2>📷 Captura Conteo Cíclico</h2>


<div id="avance"
class="card">

Cargando avance...

</div>


<label>

Escanear código:

</label>


<input 
id="codigo"
autofocus
onkeydown="buscar(event)"
>



<div id="resultado"></div>



<script>


let filaActual=null;



// ==========================
// CARGAR AVANCE
// ==========================

actualizarAvance();



function actualizarAvance(){


google.script.run

.withSuccessHandler(function(a){


document.getElementById("avance").innerHTML=

`

<b>📊 Avance del conteo</b>
<br><br>

Total productos:
<b>${a.total}</b>

<br>

Contados:
<b>${a.contados}</b>

<br>

Pendientes:
<b>${a.pendientes}</b>

<br><br>

Avance:
<b>${a.porcentaje}%</b>

`;

})


.withFailureHandler(function(error){


document.getElementById("avance").innerHTML=

"❌ Error: "+error.message;


})


.obtenerAvanceConteo();


}



// ==========================
// BUSCAR CODIGO ESCANEADO
// ==========================


function buscar(e){


if(e.key!="Enter") return;



let codigo=document
.getElementById("codigo")
.value
.trim();



if(codigo=="") return;



google.script.run

.withSuccessHandler(mostrarProducto)

.buscarCodigoConteo(codigo);



}



// ==========================
// MOSTRAR PRODUCTO
// ==========================


function mostrarProducto(p){



if(!p){


document.getElementById("resultado").innerHTML=

`

<div class="card rojo">

<h3>

❌ Producto no pertenece al conteo

</h3>

</div>

`;

return;

}



filaActual=p.fila;



// VALIDAR SI YA FUE CONTADO


if(p.fisico!=""){


document.getElementById("resultado").innerHTML=

`

<div class="card">


<h3>
⚠️ Producto ya contado
</h3>


<p>
<b>${p.producto}</b>
</p>


<p>
Conteo registrado:
${p.fisico}
</p>


<p>
Diferencia:
${p.diferencia}
</p>


<p>
Estado:
${p.estado}
</p>


</div>


`;


return;


}




document.getElementById("resultado").innerHTML=

`

<div class="card">


<h3>
${p.producto}
</h3>


<p>
<b>Código:</b>
${p.codigo}
</p>


<p>
<b>Rack:</b>
${p.rack}
</p>


<p>
<b>Ubicación:</b>
${p.ubicacion}
</p>


<p>
<b>Existencia sistema:</b>
${p.existencia}
</p>


<br>


<label>

Cantidad física:

</label>


<input 
id="cantidad"
type="number"
autofocus
>



<button onclick="guardar()">

💾 Guardar Conteo

</button>


<br><br>


<button 
class="verde"
onclick="siguiente()">

➡️ Siguiente Pendiente

</button>


</div>


`;



}



// ==========================
// GUARDAR CONTEO
// ==========================


function guardar(){



let cantidad=document
.getElementById("cantidad")
.value;



if(cantidad==""){


alert("Captura una cantidad");

return;


}



google.script.run

.withSuccessHandler(function(){


alert("✅ Conteo guardado");


actualizarAvance();



document.getElementById("codigo").value="";


document.getElementById("resultado").innerHTML="";


document.getElementById("codigo").focus();



})


.guardarConteoFisico(

filaActual,

cantidad

);



}



// ==========================
// SIGUIENTE PENDIENTE
// ==========================


function siguiente(){



google.script.run

.withSuccessHandler(function(p){



if(!p){


alert(
"✅ Conteo terminado. No hay productos pendientes"
);


return;


}



filaActual=p.fila;



document.getElementById("codigo").value=p.codigo;



document.getElementById("resultado").innerHTML=

`

<div class="card">


<h3>
${p.producto}
</h3>


<p>
<b>Código:</b>
${p.codigo}
</p>


<p>
<b>Rack:</b>
${p.rack}
</p>


<p>
<b>Ubicación:</b>
${p.ubicacion}
</p>


<p>
<b>Existencia sistema:</b>
${p.existencia}
</p>


<br>


<label>

Cantidad física:

</label>


<input 
id="cantidad"
type="number"
>


<button onclick="guardar()">

💾 Guardar Conteo

</button>



</div>


`;



})


.obtenerSiguientePendiente();



}



</script>


</body>

</html>
