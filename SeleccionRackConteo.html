<!DOCTYPE html>
<html>

<body>

<h3>📦 Seleccionar Racks</h3>

<div id="lista">
Cargando racks...
</div>


<br>


<button onclick="generar()" 
style="width:100%;padding:12px;background:#1565c0;color:white;border:0;border-radius:8px;color:white">

Generar Conteo

</button>


<script>


google.script.run
.withSuccessHandler(cargar)
.obtenerRacksConteo();



function cargar(racks){


let html="";


racks.forEach(r=>{


html += `

<div style="margin:8px">

<input type="checkbox" 
class="rack"
value="${r}">

<label>${r}</label>

</div>

`;


});


document.getElementById("lista").innerHTML=html;


}



function generar(){


let seleccionados=[];


document.querySelectorAll(".rack:checked")
.forEach(x=>{

seleccionados.push(x.value);

});



if(seleccionados.length==0){

alert("Selecciona al menos un rack");

return;

}



google.script.run
.withSuccessHandler(()=>{

google.script.host.close();

})
.generarConteoRacks(seleccionados);



}



</script>


</body>

</html>
