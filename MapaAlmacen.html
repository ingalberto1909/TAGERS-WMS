<!DOCTYPE html>
<html>

<head>

<style>

body{
font-family:Arial;
background:#f4f6f8;
padding:20px;
}

#racks{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
}

.rack{

background:#1976d2;
color:white;
padding:30px;
border-radius:12px;
cursor:pointer;
text-align:center;
font-size:20px;

}

</style>

</head>


<body>


<h1>📦 MAPA DEL ALMACÉN</h1>


<div id="racks">
Cargando racks...
</div>



<script>

let listaRacks = [];
let rackActual = [];

google.script.run
.withSuccessHandler(mostrarRacks)
.obtenerRacks();



function mostrarRacks(lista){

listaRacks = lista;

let contenedor=document.getElementById("racks");

contenedor.innerHTML="";


lista.forEach(rack=>{


let div=document.createElement("div");

div.className="rack";

div.innerHTML="📦 "+rack;


div.onclick=function(){

google.script.run
.withSuccessHandler(mostrarUbicaciones)
.obtenerUbicacionesRack(rack);

};


contenedor.appendChild(div);


});


}



function mostrarUbicaciones(datos){

rackActual = datos;

let contenedor=document.getElementById("racks");

contenedor.innerHTML="";


if(datos.length==0){

contenedor.innerHTML="No hay productos en este rack";
return;

}


// BOTON REGRESAR
let boton=document.createElement("button");

boton.innerHTML="⬅ Regresar a Racks";

boton.onclick=function(){

mostrarRacks(listaRacks);

};

contenedor.appendChild(boton);



let rack=datos[0].rack;


let titulo=document.createElement("h2");

titulo.innerHTML="📦 RACK "+rack;

contenedor.appendChild(titulo);



let niveles={};



datos.forEach(x=>{


let nivel = x.nivel.toString().trim();


if(!niveles[nivel]){

niveles[nivel]=[];

}


niveles[nivel].push(x);


});


Object.keys(niveles)
.sort((a,b)=>{

return b.localeCompare(a);

})
.forEach(nivel=>{

let fila=document.createElement("div");

fila.style.gridColumn="1 / -1";
fila.style.marginBottom="20px";

let contenedorPosiciones=document.createElement("div");

contenedorPosiciones.style.display="flex";
contenedorPosiciones.style.gap="10px";
contenedorPosiciones.style.flexWrap="wrap";


fila.innerHTML="<h3>"+nivel+"</h3>";



niveles[nivel].forEach(x=>{


let color="#9e9e9e";


if(Number(x.existencia)==0){

color="#e53935";

}

else if(Number(x.existencia)<Number(x.minimo)){

color="#fbc02d";

}

else{

color="#43a047";

}



let posicion=document.createElement("button");


posicion.style.background=color;

posicion.style.color="white";

posicion.style.margin="5px";

posicion.style.padding="20px";


posicion.innerHTML=x.posicion;



posicion.onclick=function(){

mostrarProducto(x);

};


contenedorPosiciones.appendChild(posicion);
fila.appendChild(contenedorPosiciones);
});



contenedor.appendChild(fila);


});


}


function mostrarProducto(x){

let contenedor=document.getElementById("racks");


let html = `

<div style="
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px #999;
">

<button onclick="mostrarUbicaciones(rackActual)">
⬅ Regresar al Rack
</button>


<button onclick="mostrarRacks(listaRacks)">
🏠 Racks
</button>


<h2>📍 Ubicación ${x.ubicacion}</h2>

<h3>Productos en esta posición:</h3>

`;



x.productos.forEach(p=>{


html += `

<hr>

<p><b>Producto:</b> ${p.producto}</p>

<p><b>Código:</b> ${p.codigo}</p>

<p><b>Existencia:</b> ${p.existencia}</p>

<p><b>Mínimo:</b> ${p.minimo}</p>

<p><b>Máximo:</b> ${p.maximo}</p>

<p><b>Estado:</b> ${p.estado}</p>

<p><b>Proveedor:</b> ${p.proveedor}</p>


`;



});



html += `

</div>

`;



contenedor.innerHTML = html;
function abrirRack(rack){

  return obtenerUbicacionesRack(rack);

}


}
</script>


</body>

</html>
